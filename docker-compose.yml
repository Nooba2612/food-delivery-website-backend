services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eatsy_backend
    restart: always
    env_file:
      - .env
    environment:
      DB_NAME: eatsy_food
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_DIALECT: mysql
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      SEQUELIZE_LOGGING: "false"
    depends_on:
      mysql_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/status').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  kong:
    image: kong/kong-gateway:3.14
    container_name: eatsy_kong
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: notice
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    volumes:
      - ./kong.yaml:/usr/local/kong/declarative/kong.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql_db:
    image: mysql:8.0
    container_name: eatsy_mysql
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      MYSQL_DATABASE: eatsy_food
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "9000:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./eatsy_database.sql:/docker-entrypoint-initdb.d/01-eatsy_database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
